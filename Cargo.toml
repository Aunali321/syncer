[package]
name = "syncer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MPL-2.0"
description = "Peer-to-peer folder sync between your own machines that understands Git"
repository = "https://github.com/aunali321/syncer"
readme = "README.md"
keywords = ["sync", "p2p", "git", "iroh"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
dirs = "6"
fs4 = "1"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
iroh = "1.5"
iroh-mdns-address-lookup = "0.6"
notify = "8"
rand = "0.9"
rmp-serde = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 1
